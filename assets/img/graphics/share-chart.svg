<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="Share of AI answers climbing from a low base to category leadership">
  <rect width="900" height="620" fill="#EDF3F0"/>

  <!-- gridlines -->
  <g stroke="#DDE7E2" stroke-width="1">
    <path d="M96 120H840M96 214H840M96 308H840M96 402H840M96 496H840"/>
  </g>

  <!-- competitor band (flat, muted) -->
  <path d="M96 372H840" stroke="#BCCCC5" stroke-width="2" stroke-dasharray="6 7"/>
  <text x="104" y="362" font-family="Arial, sans-serif" font-size="14" letter-spacing="2.2" fill="#7C8B85">CLOSEST RIVAL</text>

  <!-- bars -->
  <g fill="#CBDAD3">
    <rect x="118" y="470" width="58" height="60" rx="4"/>
    <rect x="208" y="452" width="58" height="78" rx="4"/>
    <rect x="298" y="416" width="58" height="114" rx="4"/>
  </g>
  <g fill="#0E9F78">
    <rect x="388" y="360" width="58" height="170" rx="4"/>
    <rect x="478" y="296" width="58" height="234" rx="4"/>
    <rect x="568" y="226" width="58" height="304" rx="4"/>
    <rect x="658" y="164" width="58" height="366" rx="4"/>
    <rect x="748" y="112" width="58" height="418" rx="4"/>
  </g>

  <!-- trend line over the bars -->
  <path d="M147 470L237 452L327 416L417 360L507 296L597 226L687 164L777 112"
        fill="none" stroke="#0B1E1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0B1E1A">
    <circle cx="147" cy="470" r="5"/><circle cx="327" cy="416" r="5"/><circle cx="507" cy="296" r="5"/>
  </g>
  <circle cx="777" cy="112" r="10" fill="#0B1E1A"/>
  <circle cx="777" cy="112" r="19" fill="none" stroke="#0B1E1A" stroke-width="1.5" opacity="0.28"/>

  <!-- axis -->
  <path d="M96 530H840" stroke="#0B1E1A" stroke-width="2"/>
  <path d="M96 100V530" stroke="#C3D2CB" stroke-width="1.5"/>

  <!-- labels -->
  <g font-family="Arial, sans-serif" font-size="14" letter-spacing="1.6" fill="#7C8B85">
    <text x="128" y="560">M1</text><text x="392" y="560">M5</text><text x="752" y="560">M9</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="#0B1E1A">
    <text x="96" y="80" font-weight="bold">SHARE OF ANSWER</text>
  </g>
</svg>
